name: AnaliseMelhor — criar e atualizar hubs temáticos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satellite-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar credenciais
        env:
          SATELLITE_REPO_TOKEN: ${{ secrets.SATELLITE_REPO_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          test -n "$SATELLITE_REPO_TOKEN" || { echo "::error::Crie o secret SATELLITE_REPO_TOKEN."; exit 1; }
          test -n "$INDEXNOW_KEY" || { echo "::error::Crie o secret INDEXNOW_KEY."; exit 1; }

      - name: Gerar os hubs temáticos
        env:
          GITHUB_OWNER: marcosrbertoni-hub
          SATELLITE_REPO_TOKEN: ${{ secrets.SATELLITE_REPO_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SOURCE_SITEMAP: https://analisemelhor.com.br/sitemap.xml
        run: bash scripts/generate-satellites.sh

      - name: Enviar hubs ao IndexNow
        env:
          GITHUB_OWNER: marcosrbertoni-hub
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: bash scripts/submit-indexnow.sh
