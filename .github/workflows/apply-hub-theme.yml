name: Aplicar tema visual aos hubs
on:
  push:
    paths:
      - "scripts/generate-satellites.sh"
      - "scripts/apply-hub-theme.sh"
      - ".github/workflows/apply-hub-theme.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Aplicar tema aos 10 hubs
        env:
          GITHUB_OWNER: marcosrbertoni-hub
          SATELLITE_REPO_TOKEN: ${{ secrets.SATELLITE_REPO_TOKEN }}
        run: bash scripts/apply-hub-theme.sh
