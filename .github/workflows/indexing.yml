name: Google Indexing API — drip-feeding diário

on:
  schedule:
    # 11:30 UTC = 08:30 no horário de Brasília (BRT).
    # O lote continua limitado a 200 URLs por execução.
    - cron: "30 11 * * *"
  workflow_dispatch:

concurrency:
  group: google-indexing-drip
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência Google
        run: python -m pip install --disable-pip-version-check -r requirements-indexing.txt

      - name: Enviar lote diário
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          INDEXING_SOURCE: data/indexing-urls.txt
        run: python scripts/google-indexing-drip.py

      - name: Commitar progresso e logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexing-state.json logs/indexing
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de estado/log para commit."
            exit 0
          fi
          git commit -m "chore: registrar progresso do drip-feeding"
          git push
